name: Build Windows 11 Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows11:
    name: Converseen Windows 11 Build
    runs-on: windows-2022

    steps:
      - name: Checkout Converseen
        uses: actions/checkout@v4

      - name: Get Converseen Version
        id: get-version
        shell: powershell
        run: |
          $CMakeLists = Get-Content CMakeLists.txt -Raw
          if ($CMakeLists -match 'project\(converseen VERSION (\d+\.\d+\.\d+\.\d+)') {
            $VERSION = $matches[1]
          } else {
            $VERSION = "0.15.1.3"
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          install-deps: "true"
          set-env: "true"

      - name: Download and Install ImageMagick
        shell: powershell
        run: |
          # Get latest ImageMagick version
          $gitTags = git ls-remote --sort="version:refname" --tags https://github.com/ImageMagick/ImageMagick.git
          $lastTagLine = $gitTags[-1]
          $lastTagVersion = $lastTagLine -replace '.*?(\d+\.\d+\.\d+-\d+).*', '$1'

          Write-Host "Installing ImageMagick $lastTagVersion..."
          Invoke-WebRequest -Uri "https://imagemagick.org/archive/binaries/ImageMagick-$lastTagVersion-Q16-HDRI-x64-dll.exe" -OutFile "ImageMagick-Installer.exe"
          .\ImageMagick-Installer.exe /MERGETASKS=install_devel /VERYSILENT /DIR=ImageMagick
          Start-Sleep -Seconds 2
          Remove-Item "ImageMagick-Installer.exe" -Force -ErrorAction SilentlyContinue

      - name: Build Converseen
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          mkdir build
          cd build

          cmake -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE:STRING=Release ^
            -DUSE_QT6=yes ^
            -DImageMagick_EXECUTABLE_DIR="${{ github.workspace }}\ImageMagick" ^
            ..

          nmake
          cpack -B package

      - name: Prepare Release Assets
        shell: powershell
        run: |
          $version = "${{ steps.get-version.outputs.version }}"
          mkdir release
          Copy-Item build/package/*.msi release/Converseen-$version-x64.msi
          Copy-Item build/package/*.zip release/Converseen-$version-x64.zip
          Get-ChildItem release/

      - name: Upload to Latest Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/Converseen-${{ steps.get-version.outputs.version }}-x64.msi
            release/Converseen-${{ steps.get-version.outputs.version }}-x64.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Converseen-Windows11-x64
          path: release/
          retention-days: 30

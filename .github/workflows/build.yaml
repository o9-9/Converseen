# Build Windows 11 Release with Auto Tag Bump
name: Build Windows 11 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Resolve the NEXT version tag once, share
  #    it with every downstream job.
  # ─────────────────────────────────────────────
  resolve-version:
    name: Resolve Next Version
    runs-on: ubuntu-latest
    outputs:
      current_tag: ${{ steps.bump.outputs.current_tag }}
      next_tag:    ${{ steps.bump.outputs.next_tag }}
      version:     ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to read tags

      - name: Compute next patch version
        id: bump
        shell: bash
        run: |
          # ── Find the latest semver tag (v0.0.0.0 style) ──────────────
          CURRENT=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1V -k2,2n -k3,3n -k4,4n \
            | tail -1)

          # Fall back to v0.15.1.4 if no tag exists yet
          CURRENT=${CURRENT:-v0.15.1.4}
          echo "Current tag: $CURRENT"

          # ── Strip the leading 'v' and split ───────────────────────────
          VER=${CURRENT#v}           # e.g. 0.15.1.4
          MAJOR=$(echo $VER | cut -d. -f1)
          MINOR=$(echo $VER | cut -d. -f2)
          PATCH=$(echo $VER | cut -d. -f3)
          BUILD=$(echo $VER | cut -d. -f4)

          # ── Bump the last (build) segment ─────────────────────────────
          NEXT_BUILD=$((BUILD + 1))
          NEXT_VER="${MAJOR}.${MINOR}.${PATCH}.${NEXT_BUILD}"
          NEXT_TAG="v${NEXT_VER}"

          echo "Next tag: $NEXT_TAG"

          # ── Export outputs ────────────────────────────────────────────
          echo "current_tag=${CURRENT}"  >> "$GITHUB_OUTPUT"
          echo "next_tag=${NEXT_TAG}"    >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_VER}"     >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # 2. Build the Windows 11 / x64 installer
  # ─────────────────────────────────────────────
  build-windows11:
    name: Converseen Windows 11 Build
    needs: resolve-version
    runs-on: windows-2022

    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout Converseen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          install-deps: "true"
          set-env: "true"

      - name: Download and Install ImageMagick
        shell: powershell
        run: |
          $gitTags = git ls-remote --sort="version:refname" --tags https://github.com/ImageMagick/ImageMagick.git
          $lastTagLine = $gitTags[-1]
          $lastTagVersion = $lastTagLine -replace '.*?(\d+\.\d+\.\d+-\d+).*', '$1'

          Write-Host "Installing ImageMagick $lastTagVersion..."
          Invoke-WebRequest `
            -Uri "https://imagemagick.org/archive/binaries/ImageMagick-$lastTagVersion-Q16-HDRI-x64-dll.exe" `
            -OutFile "ImageMagick-Installer.exe"
          .\ImageMagick-Installer.exe /MERGETASKS=install_devel /VERYSILENT /DIR=ImageMagick
          if (Test-Path "ImageMagick-Installer.exe") { Remove-Item "ImageMagick-Installer.exe" -Force -ErrorAction SilentlyContinue }

      - name: Build Converseen
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          mkdir build
          cd build

          cmake -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE:STRING=Release ^
            -DUSE_QT6=yes ^
            -DImageMagick_EXECUTABLE_DIR="${{ github.workspace }}\ImageMagick" ^
            ..

          nmake
          cpack -B package

      - name: Prepare Release Assets
        shell: powershell
        run: |
          $version = "${{ env.VERSION }}"
          mkdir release
          Copy-Item build/package/*.msi "release/Converseen-$version-x64.msi"
          Copy-Item build/package/*.zip "release/Converseen-$version-x64.zip"
          Get-ChildItem release/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Converseen-Windows11-x64-${{ env.VERSION }}
          path: release/
          retention-days: 30

  # ─────────────────────────────────────────────
  # 3. Tag + Release  (runs only after a
  #    successful build, never on tag pushes to
  #    avoid infinite loops)
  # ─────────────────────────────────────────────
  tag-and-release:
    name: Create Tag & GitHub Release
    needs: [resolve-version, build-windows11]
    runs-on: ubuntu-latest
    # Only tag when triggered by a branch push/manual run,
    # NOT when the trigger was itself a tag push (avoids loops).
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    env:
      NEXT_TAG: ${{ needs.resolve-version.outputs.next_tag }}
      VERSION:  ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: Converseen-Windows11-x64-${{ env.VERSION }}
          path: release/

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push new tag
        run: |
          echo "Tagging: $NEXT_TAG"
          git tag "$NEXT_TAG" -m "Release $NEXT_TAG (auto-bumped by CI)"
          git push origin "$NEXT_TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEXT_TAG }}
          name: "Version ${{ env.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true   # auto-fills changelog from commits
          files: |
            release/Converseen-${{ env.VERSION }}-x64.msi
            release/Converseen-${{ env.VERSION }}-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
